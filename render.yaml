services:
  # 1. AI SERVICE (Python FastAPI)
  - type: web
    name: tutobuddy-ai
    env: python
    rootDir: ai-services
    plan: free # Changed from starter to avoid payment prompt
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m nltk.downloader -d /opt/render/nltk_data wordnet omw-1.4 punkt averaged_perceptron_tagger stopwords"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 300"
    envVars:
      - key: PORT
        value: 8000
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: NLTK_DATA
        value: "/opt/render/nltk_data"

  # 2. BACKEND API (Node.js Express)
  - type: web
    name: tutobuddy-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npm run setup-db && npm start"
    envVars:
      - key: AI_SERVICE_URL
        value: "http://tutobuddy-ai:8000" # Use internal URL for speed and to bypass 30s timeouts
      - key: APPWRITE_ENDPOINT
        sync: false # Set this in the Render Dashboard
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_DATABASE_ID
        value: "tutorbuddy"
      - key: APPWRITE_STORAGE_ID
        value: "tutorbuddy"
      - key: APPWRITE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.mailtrap.io"
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # 3. FRONTEND (Next.js)
  - type: web
    name: tutobuddy-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to the public URL of tutobuddy-backend after first deploy
      - key: NEXT_PUBLIC_APPWRITE_ENDPOINT
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_DATABASE_ID
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_STORAGE_ID
        sync: false
